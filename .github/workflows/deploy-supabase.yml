name: Deploy Supabase (migraciones + edge functions)

# Sustituye el auto-deploy de Lovable: cada push a main que toque supabase/
# aplica migraciones y despliega las edge functions al proyecto cloud.
#
# Secrets necesarios en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → supabase.com → Account → Access Tokens → generar
#   SUPABASE_DB_PASSWORD   → contraseña de la base de datos del proyecto
#                            (Supabase dashboard → Settings → Database)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lyeyzdbplrgqsvyxpfek
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migraciones
        run: supabase db push

      - name: Desplegar edge functions
        # config.toml define qué funciones van sin verify_jwt
        run: supabase functions deploy
